name: Release

# Push a tag like v0.2.0 to build, sign, notarize and publish a GitHub release. The tag must match the
# VERSION file (what the app shows in Settings → About), so bump that first.
# Signing is optional: without the secrets below the build is ad-hoc signed (fine for testers,
# Gatekeeper warns on other Macs).
#
# Secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE_P12       base64 of a "Developer ID Application" certificate exported as .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   notarization (app-specific password)
#   HOMEBREW_TAP_TOKEN          token with contents write access to manhpham90vn/homebrew-tap; stable
#                               releases then update the procyon cask (`brew install manhpham90vn/tap/procyon`)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (e.g. 0.2.0-beta.1)"
        required: true

permissions:
  contents: write

env:
  XCODE_VERSION: "27.0"  # keep in sync with ci.yml

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: macOS package & GitHub release
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$v" != "$file" ]; then
            echo "::error file=VERSION::releasing $v but the VERSION file says $file; bump VERSION first"
            exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Tests
        run: swift test

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
          UNIVERSAL: "1"
        run: scripts/build-macos-app.sh release

      - name: Package, notarize
        run: scripts/package-macos.sh "${{ steps.version.outputs.value }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.value) }}
          name: Procyon ${{ steps.version.outputs.value }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/Procyon-${{ steps.version.outputs.value }}.dmg
            dist/Procyon-${{ steps.version.outputs.value }}.zip
            dist/Procyon-${{ steps.version.outputs.value }}.sha256

      - name: Update the Homebrew tap
        if: steps.version.outputs.prerelease == 'false' && env.HOMEBREW_TAP_TOKEN != ''
        run: scripts/publish-homebrew.sh "${{ steps.version.outputs.value }}"

      - name: Clean up keychain
        if: always() && env.MACOS_CERTIFICATE_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # Windows: a zip with Procyon.exe and the licenses of what it embeds, attached to the release the macOS job created.
  windows:
    name: Windows package
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: cmd
        run: call scripts\build-windows.cmd release
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ needs.release.outputs.version }}"
          # The exe embeds Inter, Nunito (SIL OFL 1.1) and Lucide icons (ISC): their licenses ship with it.
          Compress-Archive -Path dist\windows\Procyon.exe, LICENSE, README.md, design\fonts\LICENSE-Inter.txt, design\fonts\LICENSE-Nunito.txt, design\icons\LICENSE-Lucide.txt -DestinationPath "dist\Procyon-$v-windows-x64.zip" -Force
          $hash = (Get-FileHash "dist\Procyon-$v-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  Procyon-$v-windows-x64.zip" | Out-File -Encoding ascii "dist\Procyon-$v-windows-x64.sha256"
      - name: Upload to the release
        shell: pwsh
        run: |
          $v = "${{ needs.release.outputs.version }}"
          $tag = "${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.release.outputs.version) }}"
          gh release upload $tag "dist\Procyon-$v-windows-x64.zip" "dist\Procyon-$v-windows-x64.sha256" --clobber

  # Linux: a tarball and a .deb with the binary (fonts embedded), desktop entry, icon and the licenses of
  # what it embeds, attached to the same release. Built on the oldest supported base for a portable glibc.
  linux:
    name: Linux package
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools and GTK 4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libgtk-4-dev
      - name: Build and test
        run: PROCYON_VERSION="${{ needs.release.outputs.version }}" scripts/build-linux.sh release
      - name: Package
        run: scripts/package-linux.sh "${{ needs.release.outputs.version }}"
      - name: Upload to the release
        run: |
          v="${{ needs.release.outputs.version }}"
          tag="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.release.outputs.version) }}"
          gh release upload "$tag" "dist/Procyon-$v-linux-x86_64.tar.gz" dist/procyon_*_amd64.deb \
            "dist/Procyon-$v-linux-x86_64.sha256" --clobber
