name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same Xcode as local development (27). The UI needs at least the macOS 26 SDK (Liquid Glass).
  XCODE_VERSION: "27"

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Install linters
        run: brew install clang-format llvm shellcheck
      - name: Lint
        run: scripts/lint.sh

  build:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Unit tests
        run: swift test
      - name: Core (CMake) + smoke run
        run: |
          make core
          build/core/procyon-cli 1 300
      - name: App bundle
        run: VERSION="0.0.0-ci.${{ github.run_number }}" BUILD_NUMBER="${{ github.run_number }}" scripts/build-macos-app.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: Procyon-app-${{ github.sha }}
          path: dist/Procyon.app
          retention-days: 7
