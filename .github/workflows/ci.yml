name: CI

# Two kinds of job per OS, all started at once:
#   <OS> · Lint, build & test   lint, build, tests and a smoke run: the quick answer (2–5 minutes)
#   <OS> · Performance (K/N)    the spec's performance targets, the screens split across the matrix's
#                               runners (scripts/bench-*.py --shard K/N); each builds the release app itself, so
#                               none waits for another. Shard 1 also measures startup, size and accuracy.
# Linux has no performance job yet (no bench-linux.py).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same Xcode as local development: 27.0 (27A266a) on the `xcode-27` runner (macOS 27, public preview).
  # The UI needs at least the macOS 26 SDK (Liquid Glass).
  XCODE_VERSION: "27.0"

jobs:
  macos:
    name: macOS · Lint, build & test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Install linters
        run: brew install clang-format llvm shellcheck
      - name: Lint
        run: scripts/lint.sh
      - name: Unit tests
        run: swift test
      - name: Core (CMake) + smoke run
        run: |
          make core
          build/core/procyon-cli 1 300
      - name: App bundle
        run: VERSION="0.0.0-ci.${{ github.run_number }}" BUILD_NUMBER="${{ github.run_number }}" scripts/build-macos-app.sh release
      - uses: actions/upload-artifact@v7
        with:
          name: Procyon-app-${{ github.sha }}
          path: dist/Procyon.app
          retention-days: 7

  macos-performance:
    name: macOS · Performance (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false  # every shard reports its screens, whatever another one found
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Performance targets
        # Fails the build when a non-functional target in docs/procyon-spec.md is missed. The script
        # builds dist/Procyon.app (and, on shard 1, the core CLI for the accuracy checks).
        # A missed CPU or startup target is measured up to 3 times: runner noise only ever adds CPU.
        # A miss whose every attempt ran on a slow runner (timed by a fixed calibration workload, and
        # for startup by launching an empty SwiftUI app just before Procyon) is a warning, not a
        # failure. The menu bar only state still misses its targets (< 0.5% CPU,
        # < 30 MB), so it is reported without failing the build until that is fixed.
        run: >-
          scripts/bench-macos.py --attempts 3 --known-misses menubar
          --shard ${{ matrix.shard }}/${{ strategy.job-total }} --output dist/bench-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-macos-${{ matrix.shard }}-${{ github.sha }}
          path: dist/bench-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 30

  windows:
    name: Windows · Lint, build & test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Lint (generated files, clang-format, python)
        # clang-format 19.1.0 fetched by scripts\tools-windows.ps1; the runner's Python checks that
        # Tokens.generated.h matches design/tokens.json.
        shell: pwsh
        run: |
          scripts\tools-windows.ps1
          scripts\lint-windows.ps1
      - name: Build, core tests, smoke run
        # windows-latest ships Visual Studio 2022 with CMake and Ninja on PATH.
        shell: cmd
        run: |
          call scripts\build-windows.cmd release
          if errorlevel 1 exit /b 1
          build\windows\procyon-cli.exe 1 300
      - name: Render a screen offscreen
        # The app's own --screenshot mode (as in the Linux job): draws the Overview after a few
        # samples into a PNG and exits, which exercises Direct2D, DirectWrite, the fonts and the sampler.
        shell: pwsh
        run: |
          $p = Start-Process dist\windows\Procyon.exe -ArgumentList '--screenshot', 'dist\windows\overview.png', '--page', 'overview' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path dist\windows\overview.png)) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: Procyon-windows-${{ github.sha }}
          path: |
            dist\windows\Procyon.exe
            dist\windows\overview.png
          retention-days: 7

  windows-performance:
    name: Windows · Performance (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Build the app, the CLI and the probe
        shell: cmd
        run: call scripts\build-windows.cmd release --no-tests
      - name: Performance targets
        # The Windows counterpart of the macOS job: its screens plus the tray only state, measured by
        # build\windows\apps\windows\procyon-bench-probe.exe. Fails the build on a missed target.
        run: >-
          python scripts\bench-windows.py --attempts 3
          --shard ${{ matrix.shard }}/${{ strategy.job-total }} --output dist\bench-windows-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-windows-${{ matrix.shard }}-${{ github.sha }}
          path: dist\bench-windows-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 30

  linux:
    name: Linux · Lint, build & test
    # 24.04's glibc and GTK 4.14: the oldest supported base, so the binary runs on newer distributions too.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools and GTK 4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            libgtk-4-dev shellcheck xvfb
      - name: Install clang-format 19.1.0
        # The version the Windows job pins (scripts/tools-windows.ps1): apt's clang-format 18 lays out
        # `struct stat info{};` differently from 19 and later, which the sources follow.
        run: pipx install clang-format==19.1.0
      - name: Lint (generated files, clang-format, shellcheck, python)
        # clang-tidy runs in the macOS job; the Linux sources are formatted and built here.
        run: SKIP_TIDY=1 scripts/lint.sh
      - name: Build, core tests, smoke run
        run: |
          scripts/build-linux.sh release
          build/linux/procyon-cli 1 300
      - name: Render a screen offscreen
        # The app's own --screenshot mode on a virtual X display: draws the Overview after a few
        # samples and exits, which exercises GTK, the Cairo canvas, the embedded fonts and the sampler.
        run: xvfb-run -a dist/linux/procyon --screenshot dist/linux/overview.png --page overview
      - uses: actions/upload-artifact@v7
        with:
          name: Procyon-linux-${{ github.sha }}
          path: |
            dist/linux/procyon
            dist/linux/overview.png
          retention-days: 7

  linux-performance:
    name: Linux · Performance (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools and GTK 4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            libgtk-4-dev xvfb
      - name: Build the app and the CLI
        run: scripts/build-linux.sh release --no-tests
      - name: Performance targets
        # The Linux counterpart of the macOS and Windows jobs: its screens plus the background only
        # state, measured from /proc on a virtual X display. Fails the build on a missed target.
        # Xvfb has no GPU: GTK's GL renderer would run on Mesa's llvmpipe, whose buffers count as the
        # app's private memory (3-4x its own), so the Cairo renderer measures Procyon itself.
        run: >-
          xvfb-run -a scripts/bench-linux.py --attempts 3 --renderer cairo
          --shard ${{ matrix.shard }}/${{ strategy.job-total }} --output dist/bench-linux-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-linux-${{ matrix.shard }}-${{ github.sha }}
          path: dist/bench-linux-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 30
